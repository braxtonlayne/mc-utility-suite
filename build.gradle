// mc-utility-suite: client-side automation, resource-planning and accessibility mod (NeoForge 26.3, Java 25).
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Dev-only scripted in-game playtest harness (separate mod `utilitysuite_devtest`). Loaded only by `runPlaytest`,
// never part of the jar (the jar task packs sourceSets.main only).
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    // Dev-only runtime mods (Baritone in the dev client). Never packed into the jar.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    devtestCompileOnly.extendsFrom compileOnly
    devtestRuntimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version


    // Unit tests compile against Minecraft classes (BlockPos etc.). Planning logic is kept engine-agnostic so tests
    // never need the registry bootstrap.
    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.devtest)

    // Declared before `runs` so the runs can name the mods they load.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        utilitysuite_devtest {
            sourceSet(sourceSets.devtest)
        }
    }

    runs {
        client {
            client()
            // Dev only: force-apply every mixin at startup and log failures (UtilitySuiteMod.auditMixins).
            systemProperty 'utilitysuite.mixinAudit', 'true'
            loadedMods = [mods.utilitysuite]
        }
        // `./gradlew runPlaytest`: dev client + the scripted harness (src/devtest). Creates a fresh fixed-seed world,
        // runs the scenarios, writes run/playtest/report.md (+ report.json) and exits on its own.
        playtest {
            client()
            sourceSet = sourceSets.devtest
            loadedMods = [mods.utilitysuite, mods.utilitysuite_devtest]
            systemProperty 'utilitysuite.mixinAudit', 'true'
            systemProperty 'utilitysuite.playtest', 'true'
            systemProperty 'utilitysuite.moduleTiming', 'true'
            if (project.hasProperty('playtestOnly')) {
                systemProperty 'utilitysuite.playtestOnly', project.property('playtestOnly')
            }
            // ./gradlew runPlaytest -PplaytestJfr: also record a Java Flight Recording (CPU + allocation samples) to
            // run/playtest/playtest.jfr for digging into the perf scenario (`jfr view allocation-by-site ...`).
            if (project.hasProperty('playtestJfr')) {
                jvmArguments.add("-XX:StartFlightRecording=filename=${file('run/playtest/playtest.jfr')},settings=profile,dumponexit=true")
            }
        }
        // `./gradlew runArena`: dev client that quick-plays into the local bot benchmark arena server
        // (Desktop/Minecraft/tools/bot-arena, 127.0.0.1:25570) and arms the combat assistant for it (devtest ArenaClient).
        arena {
            client()
            sourceSet = sourceSets.devtest
            loadedMods = [mods.utilitysuite, mods.utilitysuite_devtest]
            systemProperty 'utilitysuite.mixinAudit', 'true'
            systemProperty 'utilitysuite.arena', 'true'
            // experiments only: ./gradlew runArena -ParenaAimSpeed=1.875 (aim speed multiplier; the hard cap still applies)
            if (project.hasProperty('arenaAimSpeed')) {
                systemProperty 'utilitysuite.arena.aimSpeed', project.property('arenaAimSpeed').toString()
            }
            // experiments only: ./gradlew runArena -ParenaSettings=velocity_lead=false,anticipatory_aim=false
            if (project.hasProperty('arenaSettings')) {
                systemProperty 'utilitysuite.arena.settings', project.property('arenaSettings').toString()
            }
            programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25570', '--username', 'Dev')
        }
        // `./gradlew runCourse`: dev client that builds the parkour benchmark course in a fresh world and times the
        // owner's runs per assist mode (devtest CourseLive; results in run/course/results.jsonl).
        course {
            client()
            sourceSet = sourceSets.devtest
            loadedMods = [mods.utilitysuite, mods.utilitysuite_devtest]
            systemProperty 'utilitysuite.course', 'true'
            // automated runner: ./gradlew runCourse -PcourseAuto=off,corrections,copilot+alt -PcourseAutoSeeds=3
            // (baritone = Baritone as the pathfinding-bot benchmark: -PcourseAuto=baritone,copilot)
            if (project.hasProperty('courseAuto')) {
                systemProperty 'utilitysuite.courseAuto', project.property('courseAuto').toString()
                systemProperty 'utilitysuite.courseAutoSeeds', (project.findProperty('courseAutoSeeds') ?: '1').toString()
            }
        }
        // Dev only: opens the menu at the title screen, saves every tab to run/ui-preview/*.png, then quits
        // (com.utilitysuite.ui.UiPreview). ./gradlew runUiPreview
        uiPreview {
            client()
            systemProperty 'utilitysuite.uiPreview', 'true'
            programArguments.addAll('--width', '1760', '--height', '990')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

def baritoneJar = files("libs/baritone-api-neoforge-${baritone_version}.jar")

dependencies {
    compileOnly baritoneJar
    testImplementation baritoneJar
    localRuntime baritoneJar

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation' << '-Xmaxerrs' << '100000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
