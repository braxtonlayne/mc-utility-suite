// mc-utility-suite: client-side automation, resource-planning and accessibility mod (NeoForge 1.21.1, Java 21, MojMap).
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    // Dev-only runtime mods (Baritone in the dev client). Never packed into the jar.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Unit tests compile against Minecraft classes (BlockPos etc.). Planning logic is kept engine-agnostic so tests
    // never need the registry bootstrap.
    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
            // Dev only: force-apply every mixin at startup and log failures (UtilitySuiteMod.auditMixins).
            systemProperty 'utilitysuite.mixinAudit', 'true'
        }
        // Dev only: opens the menu at the title screen, saves every tab to run/ui-preview/*.png, then quits
        // (com.utilitysuite.ui.UiPreview). ./gradlew runUiPreview
        uiPreview {
            client()
            systemProperty 'utilitysuite.uiPreview', 'true'
            programArguments.addAll('--width', '1760', '--height', '990')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def baritoneJar = files("libs/baritone-api-neoforge-${baritone_version}.jar")

dependencies {
    compileOnly baritoneJar
    testImplementation baritoneJar
    localRuntime baritoneJar

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
